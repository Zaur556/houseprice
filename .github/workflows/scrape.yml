name: Scrape and publish

# Scrapes every 6 hours and publishes the dashboard payload to Neon.
# The Vercel site reads it through /api/data, so no deploy is needed here.

on:
  schedule:
    - cron: "0 */6 * * *"     # every 6 hours (UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    # Change to `self-hosted` if the sites block GitHub's cloud IPs (see README).
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PROXY_URL: ${{ secrets.PROXY_URL }}
      MAX_PAGES: ${{ vars.MAX_PAGES || '40' }}
    steps:
      - name: Require DATABASE_URL
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add the DATABASE_URL secret (Neon connection string) under Settings → Secrets and variables → Actions."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Scrape
        run: python -m scraper.run
        continue-on-error: true      # publish whatever was collected even if one site failed
      - name: Fill in districts from ad pages
        run: python -m scraper.enrich
        continue-on-error: true
      - name: Publish dashboard data
        run: python -m analytics.export --no-file
      - name: Summary
        if: always()
        run: |
          if [ -n "${{ vars.SITE_URL }}" ]; then
            echo "Dashboard: ${{ vars.SITE_URL }} (updates within 5 minutes)" >> "$GITHUB_STEP_SUMMARY"
          fi
