name: Backfill history from archive.org

# Import of archived bina.az ads as price history. Each run works for up to ~5.5 hours
# and resumes where the last one stopped (pages already read are in archive_fetches),
# so the schedule below finishes the job unattended; once everything is read, a run
# takes about a minute.

on:
  schedule:
    - cron: "30 1,7,13,19 * * *"   # between the 6-hourly scrapes
  workflow_dispatch:
    inputs:
      months:
        description: "How many months back"
        default: "24"
      limit:
        description: "Max pages this run (0 = all)"
        default: "0"
      index:
        description: "skip = use the saved page list; auto = first refresh it from archive.org's CDX index (slow when that index is down)"
        default: "skip"
        type: choice
        options: [skip, auto]

permissions:
  contents: read

concurrency:
  group: backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"      # progress lines show up live in the log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Import archived ads
        run: >-
          python -m tools.backfill_archive --workers 2
          --months "${{ inputs.months || '24' }}" --limit "${{ inputs.limit || '0' }}" --index "${{ inputs.index || 'skip' }}"
        timeout-minutes: 320
        continue-on-error: true      # publish what was imported even if the run hit the time limit
      - name: Publish dashboard data
        run: python -m analytics.export --no-file
